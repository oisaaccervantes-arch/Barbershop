services:
  bizantino-api:
    build:
      context: .
    container_name: bizantino-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bizantino}
      DB_USER: ${DB_USER:-bizantino}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_PATH: /bizantino
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      EVIDENCE_DIR: /data/shift_evidence
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bizantino_evidence:/data/shift_evidence
    networks:
      - default
      caddy:
        aliases:
          - bizantino-api

  db:
    image: postgres:17-alpine
    container_name: bizantino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bizantino}
      POSTGRES_USER: ${DB_USER:-bizantino}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bizantino} -d ${DB_NAME:-bizantino}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bizantino_db:/var/lib/postgresql/data

volumes:
  bizantino_db:
  bizantino_evidence:

networks:
  caddy:
    external: true
    name: pos_default
